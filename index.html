:root{--bg:#0d1117;--panel:#161b22;--line:#2a3340;--txt:#e6edf3;--sub:#8b98a8;--acc:#58a6ff;--err:#f0565b}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}

.r{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:14px;color:var(--sub)}
.r input{width:18px;height:18px}
button{width:100%;font-size:16px;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.e{color:var(--err);font-size:13px;min-height:20px;margin-top:10px}
.u{color:var(--sub);font-size:12px;margin-top:14px;text-align:center}
.d{color:var(--sub);font-size:11px;margin-top:6px;text-align:center}
</style>
